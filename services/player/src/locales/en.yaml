info:
  text1: Bibliomap Player is a consultation events viewer generated by ezPAARSE. It allows you to visualize your files directly in the Bibliomap application and track events on an interactive map, without requiring a full installation of Bibliomap.
  text2: "To use it, simply drop your files into the dedicated location, load them, and start the simulation. It works like a video player: you can adjust the playback speed to analyze your data more or less quickly."
  text3: The interface allows you to visualize consultation events based on data generated by ezPAARSE. Each event is displayed on the map as a marker indicating its origin and type.
  rule1: 'Usage rules:'
  rule2: '- Use lightweight files (less than 50 MB) generated by ezPAARSE processing.'
  rule3:
    text: '- The "geoip-latitude" and "geoip-longitude" fields are required. These fields are added through the {link} middleware.'
    link: geolocalizer
  example:
    text: Sample files are available on {link}.
    link: GitHub