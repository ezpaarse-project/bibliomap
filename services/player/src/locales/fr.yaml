info: 
  text1: Bibliomap Player est un lecteur d’événements de consultation (EC) générés par ezPAARSE. Il permet de visualiser vos fichiers directement dans l’application Bibliomap et de suivre les événements sur une carte interactive, sans nécessiter l’installation complète de Bibliomap.
  text2: "Pour l’utiliser, il suffit de déposer vos fichiers à l’emplacement prévu, de les charger, puis de lancer la simulation. Celle-ci fonctionne comme un lecteur vidéo : vous pouvez ajuster la vitesse de lecture afin d’analyser vos données plus ou moins rapidement."
  text3: L’interface permet de visualiser les événements de consultation à partir des données issues d’ezPAARSE. Chaque événement est représenté sur la carte par un marqueur indiquant son origine et son type.
  rule1: 'Règles d’utilisation :'
  rule2: '- Utiliser des fichiers légers (moins de 50 Mo) provenant de traitements ezPAARSE.'
  rule3:
    text: '- Les champs "geoip-latitude" et "geoip-longitude" sont obligatoires. Ces champs sont ajoutés via l’utilisation du middleware {link}.'
    link: geolocalizer
  example:
    text: Des fichiers d’exemple sont mis à disposition sur {link}.
    link: GitHub